<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Alt Hop</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="app" class="app">
      <nav class="rail" aria-label="Sections">
        <div class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 17V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1"/><rect x="8" y="6" width="12" height="15" rx="2"/><circle cx="14" cy="11.5" r="2"/><path d="M11 17.5a3 3 0 0 1 6 0"/></svg></div>
        <button class="rail-btn on" id="rail-accounts" aria-label="Accounts" title="Accounts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
        <button class="rail-btn" id="rail-configs" aria-label="Game configs" title="Game configs"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></svg></button>
        <button class="rail-btn quit" id="rail-quit" aria-label="Quit" title="Quit"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button>
      </nav>

      <main class="main">
        <header class="top">
          <div class="title">
            <h1>Accounts</h1>
            <p id="subtitle"></p>
          </div>
          <div class="actions">
            <div class="seg" id="launch-seg" role="group" aria-label="Open on switch">
              <button data-v="Valorant">Valorant</button>
              <button data-v="League of Legends">League</button>
              <button data-v="Riot Client">Riot Client</button>
            </div>
            <button class="btn" id="btn-login-new"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Log in new</button>
            <button class="btn primary" id="btn-add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add account</button>
          </div>
        </header>

        <section class="list" id="list" aria-label="Account list"></section>

        <footer class="status" id="status" role="status">
          <span class="led" aria-hidden="true"></span>
          <span id="status-text">Loading accounts…</span>
          <span class="ver">v0.2.0</span>
        </footer>
      </main>

      <div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
    </div>
  </body>
</html>
